<style>
/* Une scène vue d'en haut : jauge de tempo en haut (la caméra frontale lit les cartes en arrière-plan), 4 pistes, scores, régie. Thème sombre assumé.
   Chaque joueur a son deck : Rock (orange), Classique (violet), Électro (cyan). */
:root{
  --stage:#0e1022; --panel:#171a33; --panel-2:#20244a; --line:#2f3560;
  --text:#eeedf7; --muted:#9a9ec0;
  --rock:#ff7a3d; --classic:#a493ff; --electro:#3ccfe0; --spot:#f4c64e; --good:#4fdc96; --bad:#ff5468;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--display);font-size:15px;line-height:1.4;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px 32px;
  background-image:radial-gradient(ellipse 80% 35% at 50% 0%,#2b2455 0%,transparent 70%);background-repeat:no-repeat;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;margin:0 0 8px}

/* En-tête */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;gap:3px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1;white-space:nowrap}
h1 span{color:var(--spot)}

.mesure{text-align:right}
.mesure b{font-family:var(--mono);font-size:18px;display:block;white-space:nowrap}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px}
.cam{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.ver{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cam.on{color:var(--good)}.cam.off{color:var(--bad)}
.camfeed{position:fixed;left:0;bottom:0;width:4px;height:4px;opacity:.01;pointer-events:none}
body{transition:box-shadow .15s}
body.hit{box-shadow:inset 0 0 0 6px var(--good)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--spot) 55%,transparent),transparent 65%)}
body.fx::after{animation:fxflash 1.1s ease-out}
body.fx .wrap{animation:fxpulse .7s ease-out}
body.fx .piste{animation:fxpiste .9s ease-out}
@keyframes fxflash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes fxpulse{0%{transform:scale(1)}20%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes fxpiste{0%{box-shadow:0 0 0 0 var(--spot)}25%{box-shadow:0 0 0 5px var(--spot)}100%{box-shadow:0 0 0 0 transparent}}
.chip.on{background:var(--classic);color:#14121f;border-color:var(--classic)}

/* ===================== MODE ARCADE ===================== */
:root{--neon1:#ff3df2;--neon2:#38f3ff;--gold:#ffd23f;--arc-bg:#07061a;--arc-d:"Bungee","Chakra Petch",Impact,sans-serif;--arc-t:"Chakra Petch","Avenir Next",system-ui,sans-serif}

@keyframes grid{to{background-position:0 46px,0 0}}

/* bloc meneur */

/* barre de tempo */

               /* mêmes marges que les couloirs dans la barre (bordure 2 px + marge 10 px) */

/* bloc tour */

.at-k{font-size:12px;font-weight:700;letter-spacing:.35em;color:var(--pc)}
.at-name{font-family:var(--arc-d);font-size:clamp(30px,10vw,52px);line-height:1.05;color:#fff;text-shadow:0 0 18px var(--pc);margin:4px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-tribe{font-weight:700;font-size:15px;color:#d8d4f2}

/* bonus */

/* annonce de fin de manche */
.arc-ann{position:fixed;inset:0;z-index:14;display:flex;align-items:center;justify-content:center;background:rgba(7,6,26,.78);pointer-events:none;animation:cmIn .3s ease-out}
.arc-ann[hidden]{display:none}
#ropeAnn{cursor:pointer;pointer-events:auto}
.ann-box{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:annBox .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes annBox{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.ann-k{font-family:var(--arc-d);font-size:15px;letter-spacing:.12em;color:var(--neon2);text-shadow:0 0 10px var(--neon2)}
.ann-crown{font-size:64px;filter:drop-shadow(0 0 16px var(--gold));animation:crown .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes crown{from{transform:translateY(-80px) rotate(-30deg);opacity:0}}
.ann-name{font-family:var(--arc-d);font-size:clamp(34px,12vw,60px);line-height:1;text-shadow:0 0 22px currentColor}
.ann-score{font-family:var(--arc-d);font-size:clamp(60px,22vw,110px);line-height:1;color:var(--gold);text-shadow:0 0 26px var(--gold)}
.ann-score small{font-size:.3em;margin-left:6px}
.ann-gain{font-weight:700;font-size:16px;letter-spacing:.1em;color:#ffe9a3}
/* fenêtres en mode arcade */

.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode button{padding:12px 8px;border-radius:12px;background:var(--panel-2);border:2px solid var(--line);font-weight:800;font-size:15px;line-height:1.2}
.mode button small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px}
.mode button.sel{border-color:var(--spot);background:color-mix(in srgb,var(--spot) 16%,var(--panel-2))}

/* Tirage au sort de départ */

/* Fenêtre de décompte */
#countModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:35;pointer-events:none;background:rgba(6,7,16,.55);backdrop-filter:blur(2px)}
#countModal.show{display:flex;animation:cmIn .25s ease-out}
@keyframes cmIn{from{opacity:0}}

@keyframes cmPop{0%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:1}}

#countModal.mini.out{animation:mcOut .35s ease-in forwards}@keyframes mcOut{to{opacity:0}}
.mc-box{display:flex;flex-direction:column;align-items:center;gap:22px}
.mc-num{font-family:var(--arc-d);font-size:120px;line-height:1;height:120px;color:#fff;text-shadow:0 0 22px var(--dc),0 0 6px var(--dc)}
.mc-num.pop{animation:cmPop .4s ease-out}.mc-num.gold{color:var(--gold);text-shadow:0 0 24px var(--gold),0 0 6px #fff}
.mc-dots{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;width:min(300px,78vw)}
.mc-dots i{height:12px;border-radius:3px;background:rgba(255,255,255,.08)}
.mc-dots i.bar{box-shadow:inset 3px 0 0 rgba(255,255,255,.35)}
.mc-dots i.done{background:rgba(255,255,255,.28)}
.mc-dots i.now{background:#fff;box-shadow:0 0 8px #fff}
.mc-dots i.last{background:rgba(255,200,60,.25)}.mc-dots i.last.done{background:rgba(255,200,60,.55)}
.mc-dots i.last.now{background:var(--gold);box-shadow:0 0 14px var(--gold),0 0 4px #fff}
/* Cycle de 16 temps */
.cycle{display:flex;align-items:center;gap:8px}
.cycle b{flex:1;display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.cycle i{height:10px;border-radius:3px;background:var(--panel-2)}
.cycle i.bar{box-shadow:inset 3px 0 0 var(--muted)}
.cycle i.done{background:color-mix(in srgb,var(--spot) 35%,var(--panel-2))}
.cycle i.now{background:var(--spot)}

/* Mode test solo */

/* Tempo */
.tempo{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}

.who{flex:0 0 auto;min-width:118px;max-width:46%;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;border:2px solid var(--pc,var(--spot));background:color-mix(in srgb,var(--pc,var(--spot)) 14%,var(--panel-2))}
.who .label{font-size:10px}
.who strong{font-size:17px;color:var(--pc,var(--spot));line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.who .chip{padding:5px 8px;font-size:12px;align-self:flex-start}

.bpm{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;letter-spacing:-.02em}
.bpm small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px;letter-spacing:0}

/* Tour */
.turn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--panel);border:2px solid var(--pc,var(--spot))}
.turn strong{font-size:20px;color:var(--pc,var(--spot));display:block}

/* Pistes */

.piste{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 11px 11px;min-height:110px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.piste .head{display:flex;justify-content:space-between;align-items:baseline}
.piste .head b{font-size:15px}
.piste .body{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.piste .glyph{font-size:24px;line-height:1}
.tdot{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-.05em;flex-shrink:0;box-shadow:0 0 0 1.5px rgba(255,255,255,.25)}
.piste .glyph .tdot,.rp-gl .tdot{width:22px;height:22px}

.owner{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--oc);color:#14121f;font-weight:800;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.piste .empty{color:var(--muted);font-size:13px}

.piste.F{border-color:color-mix(in srgb,var(--rock) 65%,var(--line))}
.piste.N{border-color:color-mix(in srgb,var(--classic) 65%,var(--line))}
.piste.E{border-color:color-mix(in srgb,var(--electro) 65%,var(--line))}

.piste.last{border:2px solid var(--lc);box-shadow:0 0 0 4px color-mix(in srgb,var(--lc) 30%,transparent),0 0 22px color-mix(in srgb,var(--lc) 35%,transparent)}

/* Scores & régie */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.score{position:relative;background:var(--panel);border-radius:14px;padding:9px 12px 10px;border:2px solid color-mix(in srgb,var(--pc) 55%,var(--line));border-top:5px solid var(--pc)}

.score>span{font-size:13px;font-weight:800;color:var(--pc);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score b{font-family:var(--mono);font-size:40px;line-height:1.05;display:block;letter-spacing:-.03em}
.score .gain{position:absolute;right:10px;top:8px;font-family:var(--mono);font-size:22px;font-weight:600;color:var(--spot);opacity:0;pointer-events:none}
body.fx .score .gain{animation:gain 1.6s ease-out}
@keyframes gain{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

.btn{border-radius:12px;padding:13px 10px;font-weight:800;font-size:15px;background:var(--panel-2);border:1px solid var(--line);text-align:center}
.btn.main{background:var(--spot);color:#1a1530;border-color:var(--spot)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ready{animation:ready 1s ease-in-out infinite alternate}
@keyframes ready{to{box-shadow:0 0 0 6px color-mix(in srgb,var(--spot) 35%,transparent)}}

/* Onglets bas */

/* Feuilles */
.overlay{position:fixed;inset:0;background:rgba(6,7,16,.8);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:13px;max-height:88vh;overflow:auto}
.sheet h2{margin:0;font-size:21px;text-wrap:balance}
.row{display:flex;gap:8px}.row .btn{flex:1}

.count{display:flex;gap:6px}
.count button{flex:1;padding:10px;border-radius:10px;background:var(--panel-2);border:2px solid var(--line);font-weight:800}
.count button.sel{border-color:var(--spot)}
.pl{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--panel-2);border-left:5px solid var(--pc)}
.pl input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font:inherit}
.decks{display:flex;gap:6px}
.decks button{flex:1;padding:8px 4px;border-radius:9px;background:var(--panel);border:2px solid var(--line);font-size:13px;font-weight:800}
.decks button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.decks button.sel{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 22%,var(--panel))}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--stage);padding:14px 18px;border-radius:14px;font-weight:800;font-size:17px;line-height:1.3;z-index:30;max-width:calc(100% - 28px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.piste.now{box-shadow:0 0 0 3px var(--ac),0 0 22px var(--ac)}
/* ===== mode La Corde ===== */
body.rope .wrap{display:none}

body.rope{background:var(--arc-bg);background-image:none}
#rope{position:relative;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 18px;display:flex;flex-direction:column;gap:10px;font-family:var(--arc-t);color:#fff;max-width:640px;margin:0 auto}
.rp-log{display:none!important}
.rp-lat{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;padding:8px;border-radius:12px;border:1px solid rgba(255,255,255,.12);font-size:13px;color:#cfcbe8}
.rp-lat button{font:inherit;font-size:15px;color:#fff;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);border-radius:10px;padding:6px 14px}
.rp-lat b{font-family:var(--mono);color:var(--gold);min-width:64px;text-align:center}
.rp-sim{display:flex;flex-direction:column;gap:10px;margin-top:4px}.rp-sim[hidden]{display:none!important}
.sim-g{border-radius:14px;padding:8px 10px;border:2px dashed color-mix(in srgb,var(--pc,#fff) 40%,transparent);background:rgba(255,255,255,.03)}
.sim-g.on{border-style:solid;border-color:var(--pc);box-shadow:0 0 12px color-mix(in srgb,var(--pc) 45%,transparent)}
.sim-g h4{margin:0 0 6px;font-size:14px;color:var(--pc,#fff);display:flex;gap:8px;align-items:baseline}.sim-g h4 small{color:#cfcbe8;font-weight:400}
.sim-g.act{--pc:#ffd23f}
.sim-row{display:flex;flex-wrap:wrap;gap:5px}
.sim-c{font:inherit;color:#fff;border:1px solid color-mix(in srgb,var(--pc,#fff) 45%,transparent);background:rgba(255,255,255,.06);border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;align-items:center;min-width:52px;line-height:1.1}
.sim-c b{font-size:13px}.sim-c small{font-size:11px;color:#cfcbe8}
.sim-c.re{border-color:#ff5468}.sim-c.used,.sim-c:disabled{opacity:.35}
.sim-c:active{transform:scale(.95)}
#rope[hidden]{display:none!important}
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rp-top .t{font-family:var(--arc-d);font-size:18px;color:var(--neon2);text-shadow:0 0 10px var(--neon2)}
.rp-btns{display:flex;gap:6px;flex-shrink:0}.rp-top .t{white-space:nowrap}
.rp-top button{font:inherit;font-size:13px;padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff}
.rp-top button:disabled{opacity:.35}
.rp-scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.rp-sc{position:relative;overflow:hidden;border:2px solid color-mix(in srgb,var(--pc) 55%,transparent);border-radius:14px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04)}
.rp-sc.on{border-color:var(--pc);box-shadow:0 0 14px var(--pc)}
.rp-sc span{font-weight:700;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-sc b{font-family:var(--arc-d);font-size:26px}
.rp-sc i{position:absolute;left:0;bottom:0;height:3px;background:var(--pc)}
.rp-turn{width:100%;padding:5px 12px;border-radius:14px;border:2px solid var(--pc);background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 24%,transparent),transparent);
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap;min-width:0}
.rp-turn .at-k{font-size:10px;letter-spacing:.2em;white-space:nowrap}
.rp-turn .at-name{font-size:clamp(18px,5.5vw,24px);margin:0;text-shadow:0 0 10px var(--pc);min-width:0}
.rp-turn .at-tribe{font-size:12px;color:#cfcbe8;white-space:nowrap}
.rp-tracks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rp-tr{position:relative;border-radius:16px;padding:8px 8px 10px;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);transition:box-shadow .2s,border-color .2s}
.rp-tr.now{border-color:var(--kc);box-shadow:0 0 18px color-mix(in srgb,var(--kc) 70%,transparent)}
.rp-h{display:flex;gap:6px;align-items:center}.rp-h b{font-size:15px}.rp-now{color:var(--gold);animation:rpblink .6s infinite alternate}
.rp-svg{width:100%;height:auto;display:block;margin:4px 0;overflow:visible}
.rp-rope{fill:none;stroke:rgba(255,255,255,.4);stroke-width:.5}
.rp-tick{stroke:rgba(255,255,255,.3);stroke-width:.25}
.rp-pull{stroke-width:.7;opacity:.85}
.rp-knot{stroke:#fff;stroke-width:.35}.sab-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

.rp-log{min-height:2.4em;text-align:center;font-size:14px;color:#e8e6ff;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.05)}

.rp-ban{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;background:#0d0b2b;border:2px solid var(--neon2);border-radius:20px;padding:16px 22px;text-align:center;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 30px rgba(56,243,255,.35);animation:rpban 3.7s ease forwards;min-width:240px}
.rp-ban[hidden]{display:none}.rp-ban b{font-family:var(--arc-d);font-size:30px;text-shadow:0 0 14px currentColor}.rp-ban span{color:#e8e6ff}
@keyframes rpban{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0}}
body.rope .sheet{background:#0d0b2b;border:2px solid var(--neon2);font-family:var(--arc-t);color:#fff}
.mode{flex-wrap:wrap}
.rp-hint{display:block;font-size:11px;color:#9a96bf;margin-top:4px}
.rp-react{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;background:#2a0f1a;border:2px solid #ff5468;border-radius:16px;padding:10px 16px;font-weight:700;box-shadow:0 0 20px rgba(255,84,104,.5);white-space:nowrap}
.rp-react{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,420px);text-align:center}
.rp-react.full{inset:0;left:0;right:0;bottom:0;top:0;transform:none;width:auto;border:0;border-radius:0;box-shadow:none;background:rgba(3,3,10,.72);justify-content:center;gap:20px;z-index:30;padding:20px}

<script type="text/plain" id="moteurSrc">
/* Tourne dans le FIL AUDIO (AudioWorklet) pendant la mesure du décalage au micro :
   « ts-micro » enregistre le micro avec l'heure exacte de chaque morceau. */
class Micro extends AudioWorkletProcessor {
  constructor() {
    super(); this.on = true; this.buf = new Float32Array(8192); this.n = 0; this.f = 0;
    this.port.onmessage = e => { if (e.data === "fin") { this.envoyer(); this.on = false; } };
  }
  envoyer() { if (!this.n) return; const d = this.buf.slice(0, this.n); this.port.postMessage({ f: this.f, d }, [d.buffer]); this.n = 0; }
  process(inputs) {
    if (!this.on) return false;
    const x = inputs[0] && inputs[0][0];
    if (x && x.length) {
      /* trou dans l'enregistrement, ou tampon plein : on envoie et on commence un nouveau morceau */
      if (this.n && (this.f + this.n !== currentFrame || this.n + x.length > this.buf.length)) this.envoyer();
      if (!this.n) this.f = currentFrame;
      this.buf.set(x, this.n); this.n += x.length;
    }
    return true;
  }
}
registerProcessor("ts-micro", Micro);
</script>
<script>
const VERSION="v101";
/* Tribes Showdown — deux versions du jeu : 🪢 La Corde (on scanne les cartes) et 🧪 Essai (la même partie, decks à l'écran).
   Les valeurs des cartes et les règles chiffrées viennent de ton Google Sheet (voir « Cartes et règles » plus bas). */
/* ================= Données ================= */
const PISTES={R:"Rythme",B:"Basse",H:"Harmonie",M:"Mélodie"};
const PORDER=["R","B","H","M"];
/* Les lettres F, N, E, S sont celles des QR codes déjà imprimés : on les garde. Noms et couleurs : onglet « Réglages » du sheet. */
const DECKS={
  F:{name:"Tribu 1",short:"Tribu 1",color:"#ff7a3d"},
  N:{name:"Tribu 2",short:"Tribu 2",color:"#a493ff"},
  E:{name:"Tribu 3",short:"Tribu 3",color:"#3ccfe0"},
  S:{name:"Tribu 4",short:"Tribu 4",color:"#ff5fa2"}};
/* Symbole d'une tribu : un rond plein de sa couleur */
for(const k in DECKS)DECKS[k].glyph=`<i class="tdot" style="background:${DECKS[k].color}"></i>`;
/* Cartes des tribus (QR BOUCLE:RF2…) : piste (R B H M) + tribu + 2 ou 4. Joker : J + tribu + 2. */
const CARDS={};
for(const p of PORDER)for(const d of "FNES")for(const v of [2,4])CARDS[p+d+v]={id:p+d+v,kind:"inst",piste:p,deck:d};
for(const d of "FNES")CARDS["J"+d+"2"]={id:"J"+d+"2",kind:"inst",piste:"*",deck:d,joker:true};

/* ================= État ================= */
let S=null,undoStack=[],pending=null,soundOn=true;
function fresh(players){return{players:players.map(p=>({name:p.name,deck:p.deck,color:DECKS[p.deck].color,score:0})),
  turn:0,bpm:ROPE.BPM,stacks:{R:[],B:[],H:[],M:[]},ended:false,last:null,seqN:0};}
function snap(){undoStack.push(JSON.stringify(S));if(undoStack.length>80)undoStack.shift();}
const topOf=p=>{const s=S.stacks[p];return s.length?s[s.length-1]:null};
const ownerOf=deck=>S.players.findIndex(p=>p.deck===deck);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT;function toast(m){clearTimeout(toastT);let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}t.textContent=m;toastT=setTimeout(()=>t.remove(),2800);}
function render(){if(S&&S.rope)renderRope();}

/* ================= Mise en place : un deck par joueur ================= */
let modeChoice="corde";try{modeChoice=localStorage.getItem("ts-mode")||"corde";}catch(e){}
if(!["corde","mp3"].includes(modeChoice))modeChoice="corde";   /* « mp3 » = Essai */
/* arrêt complet : musique, boucles, caméra, minuteries (en quittant une partie) */
let camStream=null;
function stopEverything(){
  pending=null;
  if(schedTimer){clearInterval(schedTimer);schedTimer=null;}
  /* Quitter en douceur : la musique s'éteint en 0,15 s (pas de coupure sèche ni de clic), puis le son reste allumé
     mais muet 3,5 s ; ensuite seulement il est mis en pause (une pause en plein son claque sur iPhone). */
  let tq=0;
  if(ctx&&ctx.state==="running"&&window.__masterOut){const g=window.__masterOut.gain,n=ctx.currentTime;tq=n+.16;
    g.cancelScheduledValues(n);g.setValueAtTime(g.value,n);g.linearRampToValueAtTime(0,n+.15);QUITMUTE=true;
    clearTimeout(QUITT);QUITT=setTimeout(()=>{if(ctx&&!schedTimer&&ctx.state==="running")ctx.suspend().catch(()=>{});},3500);}
  else if(ctx&&ctx.state==="running")ctx.suspend().catch(()=>{});
  try{plReset(tq);stopAllSamples(tq);}catch(e){}
  scanning=false;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}try{video.srcObject=null;}catch(e){}
  const cm=$("countModal");if(cm)cm.className="";
  camState("","Caméra arrêtée");
}
let WAKE=null;
function wakeOn(){try{if(navigator.wakeLock&&!WAKE)navigator.wakeLock.request("screen").then(w=>{WAKE=w;w.addEventListener("release",()=>{WAKE=null;});}).catch(()=>{});}catch(e){}}

/* règles de La Corde, avec les valeurs du moment (celles du sheet) */
function reglesHTML(){const R=ROPE,cnt={};for(const q in RACT_IDS)cnt[RACT_IDS[q]]=(cnt[RACT_IDS[q]]||0)+1;
  const A=k=>esc(RACT[k].n),D=k=>esc(RACT[k].d.replace(/^Réaction\s*:\s*/i,"")),nA=Object.keys(RACT_IDS).length;
  return `<ul class="regles">
    <li>Une seule corde commune, en étoile : une branche graduée de ${R.R} crans par joueur, partant du centre (à 2 joueurs, les deux branches forment une ligne). Le curseur glisse toujours le long des branches : pour passer chez un autre joueur, il repasse par le centre. Ton camp commence à ${R.CAMP} crans du centre sur ta branche. À 2 joueurs, la corde démarre à ${R.START2} crans vers le premier joueur.</li>
    <li>Chaque instrument a des <b>points de victoire</b> (★) et une <b>traction</b>. Plus il rapporte, moins il tire.</li>
    <li><b>Ton tour</b> : scanne une carte et pose-la sur sa piste. Elle tire le curseur vers toi. Si le curseur est alors dans ton camp, ta carte se <b>verrouille</b> jusqu'à la fin de la manche.</li>
    <li><b>Surenchère</b> (cartes ⚡) : si elle recouvre une carte adverse qui vaut moins de points, elle tire +1.</li>
    <li>Joker : traction pure, 0 point, il ne se pose pas.</li>
    <li><b>Deck Action</b> (${nA} cartes communes : ${Object.keys(cnt).map(k=>A(k)+" ×"+cnt[k]).join(", ")}). À la fin de ton tour, pioche dans ton deck <b>ou</b> une carte Action. Une carte recouverte reste sur sa piste, sous la nouvelle. Quand ton deck est vide, remélange ta défausse.</li>
    <li>Pendant ton tour, <b>avant ta carte</b>, tu peux jouer une Action (une seule, +1 point) : ${["ELAN","REINS","CADENAS","PROJO"].filter(k=>cnt[k]).map(k=>`<b>${A(k)}</b> (${D(k)})`).join(" ; ")}</li>
    <li><b>Réactions</b>, jouées par un adversaire juste après la pose d'une carte : ${["COUPURE","SABOT"].filter(k=>cnt[k]).map(k=>`<b>${A(k)}</b> (${D(k)})`).join(" ; ")} À 3 ou 4 joueurs, si le ${A("SABOT")} fait repasser la corde par le centre, elle part vers le saboteur. Après la dernière carte d'une manche, il reste ${Math.round(ROPE_REACT_MS/1000)} secondes pour réagir.</li>
    <li><b>Fin de manche</b> : chacun marque ses cartes visibles ; +${R.BONUS} pour le camp de la corde ; <b>Chœur</b> : +${R.CHOIR} si tu tiens au moins ${R.CHOIR_MIN} pistes. La corde recule vers le centre (elle garde ${Math.round(R.PENTE*100)} % de sa distance) et les verrous sautent.</li>
    <li><b>Ordre</b> : à la manche suivante, le joueur en tête au score joue en premier, le dernier au score en dernier.</li>
    <li><b>Dernière manche</b> (${R.ROUNDS}e) : cartes ×2, corde +${R.BONUS_FINAL}. Puis le meilleur score gagne ; égalité : celui qui tient le plus de pistes.</li>
    <li><b>Objectifs secrets</b> (option) : avant la partie, chacun pioche une carte Objectif et scanne son QR. Révélés et comptés à la fin.</li>
    <li><b>Musique</b> : manches 1 à ${Math.floor(R.ROUNDS/2)}, sons des dossiers « calme » ; ensuite, « fort ». Une carte posée démarre au début du cycle suivant de 4 mesures.</li></ul>`;}
function leaderOf(){const mx=Math.max(...S.players.map(p=>p.score));return{mx,who:S.players.filter(p=>p.score===mx)};}

/* ================= MODE « LA CORDE » : 2 à 4 joueurs =================
   - Une seule corde commune. Chaque carte tire le curseur vers toi de sa traction.
   - Un instrument se pose sur sa piste (il recouvre la carte du dessus) et vaut ses points de victoire.
     Si, une fois posée, le curseur est dans ton camp, la carte se verrouille jusqu'à la fin de la manche.
   - Surenchère : recouvrir une carte adverse qui vaut moins de points → +1 de traction.
   - Joker et cartes Action : traction pure, 0 point, elles ne se posent pas sur une piste.
   - Fin de manche (chaque joueur a joué une fois) : chacun marque ses cartes visibles, +3 pour le camp de la corde,
     +3 (Chœur) si un joueur tient au moins 3 pistes. La corde recule d'un quart vers le centre (la pente).
     La manche suivante, le joueur en tête au score joue en premier (le dernier au score joue en dernier).
   - À 2 joueurs, la corde démarre à 2 crans vers le premier joueur (jouer en dernier dans une manche est un avantage).
   - Dernière manche : toutes les cartes comptent double, bonus de corde +5.
   - Les valeurs ci-dessous sont celles d'origine : celles de ton Google Sheet les remplacent (voir plus bas).
   - Option objectifs secrets : chaque joueur scanne une carte Objectif à son premier tour ; révélés et comptés à la fin. */
const ROPE={BPM:120,R:10,CAMP:3,PENTE:.75,BONUS:3,BONUS_FINAL:5,CHOIR:3,CHOIR_MIN:3,ROUNDS:8,MODAL_MS:5000,DUCK:.2,START2:2};
const RV={RF2:[1,5],RF4:[4,2],BF2:[2,4],BF4:[5,1],HF2:[3,3],HF4:[2,4],MF2:[4,2],MF4:[3,3],
  RN2:[3,3],RN4:[2,4],BN2:[4,2],BN4:[1,5],HN2:[5,1],HN4:[3,3],MN2:[2,4],MN4:[4,2],
  RE2:[2,4],RE4:[5,1],BE2:[3,3],BE4:[4,2],HE2:[1,5],HE4:[4,2],ME2:[3,3],ME4:[2,4],
  RS2:[4,2],RS4:[3,3],BS2:[2,4],BS4:[3,3],HS2:[4,2],HS4:[2,4],MS2:[5,1],MS4:[1,5],
  JF2:[0,6],JN2:[0,6],JE2:[0,6],JS2:[0,6]};
/* cartes Surenchère : les deux cartes à 4 points de chaque tribu */
const SUR=new Set(Object.keys(RV).filter(k=>RV[k][0]===4));
/* objectifs secrets (QR au recto : BOUCLE:O01…) */
const OBJ={
  O01:{t:"Tenir le Rythme (A) à la fin de la partie",v:4,ok:(i,R)=>topOwnerEnd(R,"R")===i},
  O02:{t:"Tenir la Basse (B) à la fin de la partie",v:4,ok:(i,R)=>topOwnerEnd(R,"B")===i},
  O03:{t:"Tenir l'Harmonie (C) à la fin de la partie",v:4,ok:(i,R)=>topOwnerEnd(R,"H")===i},
  O04:{t:"Tenir la Mélodie (D) à la fin de la partie",v:4,ok:(i,R)=>topOwnerEnd(R,"M")===i},
  O05:{t:"Verrouiller 3 cartes",v:5,ok:(i,R)=>R.st[i].locks>=3},
  O06:{t:"Gagner 2 fois le bonus de corde",v:5,ok:(i,R)=>R.st[i].ropeWins>=2},
  O07:{t:"Finir la partie avec la corde dans ton camp",v:8,ok:(i,R)=>R.finalCamp===i},
  O08:{t:"Tenir 3 pistes à la fin d'une manche",v:4,ok:(i,R)=>R.st[i].held3},
  O09:{t:"Recouvrir 6 cartes adverses",v:4,ok:(i,R)=>R.st[i].covers>=6},
  O10:{t:"Réussir 2 surenchères",v:5,ok:(i,R)=>R.st[i].sur>=2},
  O11:{t:"Tenir 2 pistes voisines à la fin de la partie (A-B, B-C, C-D ou D-A)",v:4,ok:(i,R)=>[["R","B"],["B","H"],["H","M"],["M","R"]].some(([a,b])=>topOwnerEnd(R,a)===i&&topOwnerEnd(R,b)===i)},
  O12:{t:"Marquer le plus de points pendant la dernière manche",v:5,ok:(i,R)=>R.lastBest===i}};
for(const k in OBJ)CARDS[k]={id:k,kind:"obj"};
/* Deck Action commun (15 cartes, QR BOUCLE:A01…A16 sauf A12). Aucune cible à choisir :
   - jouées pendant ton tour, AVANT ta carte (une seule par tour, +1 point) : Élan, Coup de reins, Cadenas, Projecteur ;
   - jouées en RÉACTION par un adversaire sur la carte qui vient d'être posée (pas de point) : Coupure, Sabotage. */
const RACT={ELAN:{n:"Élan",tr:4,d:"Tire la corde vers toi de {traction}."},REINS:{n:"Coup de reins",tr:6,d:"Tire la corde vers toi de {traction}."},
  CADENAS:{n:"Cadenas",d:"Verrouille ta dernière carte posée jusqu'à la fin de la manche."},
  PROJO:{n:"Projecteur",d:"La carte que tu poses ce tour marque double à cette fin de manche (perdu si elle est recouverte)."},
  COUPURE:{n:"Coupure",react:true,d:"Réaction : annule la carte qui vient d'être posée. Elle part dans la défausse de son propriétaire, la carte d'en dessous rejoue et la corde revient en arrière."},
  SABOT:{n:"Sabotage",react:true,d:"Réaction : la carte qui vient d'être posée ne marque pas à cette fin de manche, et la corde s'éloigne de 2 de son propriétaire."}};
const RACT_IDS={A01:"ELAN",A02:"ELAN",A03:"ELAN",A04:"REINS",A05:"REINS",A06:"CADENAS",A07:"CADENAS",A08:"CADENAS",
  A09:"COUPURE",A10:"COUPURE",A11:"COUPURE",A13:"SABOT",A14:"SABOT",A15:"PROJO",A16:"PROJO"};
for(const k in RACT_IDS)CARDS[k]={id:k,kind:"ract",act:RACT_IDS[k]};
let ROPE_REACT_MS=10000;let RREACT=null;
/* ===== Cartes et règles : lues dans ton Google Sheet =====
   L'app lit les onglets « Toutes les cartes » (points, traction, surenchère, cartes Action, objectifs) et « Réglages »
   (tribus, actions, règles chiffrées) par le petit script Google du sheet — le même que pour les statistiques :
   une seule adresse à coller dans l'app, gardée sur le téléphone (jamais dans le dépôt public).
   Lecture : à l'ouverture, à chaque retour au menu et quand on revient sur l'app. JAMAIS pendant une partie.
   Sans réseau : la dernière copie lue sert. Sans adresse ni copie : les valeurs intégrées ci-dessus. */
const CK="ts-cartes-sheet";
let CARTES_INFO="valeurs intégrées",CARTES_TAG="intégrées",CARTES_T=0,CARTES_BUSY=false,CARTES_ENCORE=false;
const num=v=>v!==null&&v!==undefined&&v!==""&&isFinite(+v);
const txt=(s,n)=>String(s).replace(/[<>]/g,"").trim().slice(0,n||400);
/* valeurs intégrées : chaque lecture repart d'elles (une case vidée dans le sheet reprend sa valeur d'origine) */
const DEF0=JSON.parse(JSON.stringify({tribus:Object.keys(DECKS).map(k=>[k,DECKS[k].name,DECKS[k].color]),rv:RV,act:RACT,qr:RACT_IDS,
  obj:Object.keys(OBJ).map(k=>[k,OBJ[k].t,OBJ[k].v]),rope:ROPE,react:ROPE_REACT_MS}));
function cartesDefaut(){const D=DEF0;
  for(const [k,n,c] of D.tribus){DECKS[k].name=DECKS[k].short=n;DECKS[k].color=c;}
  for(const id in D.rv)RV[id]=[...D.rv[id]];
  for(const a in D.act)RACT[a]=Object.assign({},D.act[a]);
  for(const q in RACT_IDS)delete RACT_IDS[q];Object.assign(RACT_IDS,D.qr);
  for(const [k,t,v] of D.obj){OBJ[k].t=t;OBJ[k].v=v;}
  for(const k in D.rope)if(k!=="BPM")ROPE[k]=D.rope[k];   /* le tempo reste celui des MP3 (sons/reglages.json) */
  ROPE_REACT_MS=D.react;}
/* recalcule ce qui découle des valeurs : symbole des tribus, cartes Surenchère, cartes Action reconnues au scan */
function cartesFin(j){
  for(const k in DECKS)DECKS[k].glyph=`<i class="tdot" style="background:${DECKS[k].color}"></i>`;
  SUR.clear();for(const id in RV){if(!/^[RBHM][FNES][24]$/.test(id))continue;const c=j&&j.cartes&&j.cartes[id];
    if(c&&typeof c.surenchere==="boolean"?c.surenchere:RV[id][0]===4)SUR.add(id);}
  for(const id in CARDS)if(CARDS[id].kind==="ract")delete CARDS[id];
  for(const q in RACT_IDS)CARDS[q]={id:q,kind:"ract",act:RACT_IDS[q]};
  for(const a in RACT)RACT[a].d=RACT[a].tr!==undefined?RACT[a].d.replace(/\{traction\}/g,RACT[a].tr):RACT[a].d.replace(/\s*\{traction\}/g,"");}
function appliquerCartes(j){const ob=x=>x&&typeof x==="object";if(!ob(j))return;
  if(ob(j.tribus))for(const k in j.tribus)if(DECKS[k]&&ob(j.tribus[k])){const t=j.tribus[k];
    if(t.nom)DECKS[k].name=DECKS[k].short=txt(t.nom,24);
    if(/^#[0-9a-f]{6}$/i.test(String(t.couleur||"").trim()))DECKS[k].color=String(t.couleur).trim();}
  if(ob(j.cartes))for(const id in j.cartes)if(RV[id]&&ob(j.cartes[id])){const c=j.cartes[id];if(num(c.points))RV[id][0]=Math.max(0,+c.points);if(num(c.traction))RV[id][1]=Math.max(0,+c.traction);}
  if(ob(j.jokers))for(const id in j.jokers)if(RV[id]&&ob(j.jokers[id])&&num(j.jokers[id].traction))RV[id][1]=Math.max(0,+j.jokers[id].traction);
  if(ob(j.actions))for(const a in j.actions)if(RACT[a]&&ob(j.actions[a])){const x=j.actions[a];
    if(x.nom)RACT[a].n=txt(x.nom,30);if(x.texte)RACT[a].d=txt(x.texte);if(RACT[a].tr!==undefined&&num(x.traction))RACT[a].tr=Math.max(0,+x.traction);}
  if(ob(j.qr_actions))for(const q in j.qr_actions){if(!/^A\d\d$/.test(q))continue;const a=j.qr_actions[q];   /* "" = carte retirée ; vide ou nom inconnu = action d'origine */
    if(a==="")delete RACT_IDS[q];else if(RACT[a])RACT_IDS[q]=a;}
  if(ob(j.objectifs))for(const o in j.objectifs)if(OBJ[o]&&ob(j.objectifs[o])){const x=j.objectifs[o];if(x.texte)OBJ[o].t=txt(x.texte,120);if(num(x.points))OBJ[o].v=+x.points;}
  if(ob(j.regles)){const r=j.regles,m={manches:"ROUNDS",corde:"R",camp:"CAMP",pente:"PENTE",bonus:"BONUS",bonus_final:"BONUS_FINAL",choeur:"CHOIR",choeur_min:"CHOIR_MIN",depart_2j:"START2"};
    for(const k in m)if(num(r[k]))ROPE[m[k]]=+r[k];
    ROPE.ROUNDS=Math.max(1,Math.min(30,Math.round(ROPE.ROUNDS)));ROPE.R=Math.max(3,Math.min(30,Math.round(ROPE.R)));ROPE.CAMP=Math.max(0,Math.min(ROPE.R-1,ROPE.CAMP));
    ROPE.PENTE=Math.max(0,Math.min(1,ROPE.PENTE));ROPE.START2=Math.max(0,Math.min(ROPE.R,ROPE.START2));
    if(num(r.reaction_s))ROPE_REACT_MS=Math.max(2,+r.reaction_s)*1000;if(num(r.annonce_s))ROPE.MODAL_MS=Math.max(1,+r.annonce_s)*1000;}}
/* repart des valeurs intégrées puis applique le sheet ; faux si le sheet est illisible (on garde alors les valeurs intégrées) */
function cartesUse(j){cartesDefaut();let ok=true;
  if(j){try{appliquerCartes(j);}catch(e){console.warn("cartes du sheet",e);cartesDefaut();ok=false;j=null;}}
  cartesFin(j);return ok;}
const quand=t=>{const d=new Date(t),z=n=>String(n).padStart(2,"0");return `${z(d.getDate())}/${z(d.getMonth()+1)} à ${z(d.getHours())}h${z(d.getMinutes())}`;};
const enPartie=()=>!!(S&&S.rope&&!S.ended);
const tribusCle=()=>JSON.stringify(Object.keys(DECKS).map(k=>[DECKS[k].name,DECKS[k].color]));

  CARTES_TAG=j&&ok?"sheet "+(j.empreinte||"?"):"intégrées";CARTES_INFO=ok?info:"valeurs intégrées (sheet illisible)";cartesInfo();

function cartesInfo(){const el=$("cartesS");if(el)el.textContent="🃏 Cartes : "+(CARTES_BUSY?"⏳ lecture de ton sheet…":CARTES_INFO);}
async function chargerCartes(){
  if(enPartie())return;
  if(CARTES_BUSY){CARTES_ENCORE=true;return;}   /* une lecture est en cours : on relira juste après (adresse changée, 🔄…) */
  const c=cartesCache(),url=statsUrl();
  /* tout de suite : la dernière copie lue (l'écran n'attend pas le réseau) */
  if(!CARTES_T)cartesMettre(c&&c.j,c?`copie de ton sheet lue le ${quand(c.t)}`:url?"valeurs intégrées":"valeurs intégrées · relie ton sheet ci-dessous");
  if(!url)return;
  CARTES_BUSY=true;cartesInfo();
  try{
    const t=await Promise.race([fetch(url+(url.includes("?")?"&":"?")+"cartes=1",{cache:"no-store"}).then(r=>r.text()),new Promise((_,no)=>setTimeout(()=>no(new Error("pas de réponse")),12000))]);let j=null;try{j=JSON.parse(t);}catch(e){}
    if(!j||j.format!=="tribes-cartes")throw new Error(j&&j.erreur?j.erreur:/fonctionne/.test(t)?"le script du sheet est à mettre à jour":"réponse inattendue du script");
    if(url!==statsUrl())return;   /* adresse changée pendant la lecture : la relecture qui suit lira la nouvelle */
    const neuf=!!(c&&c.j.empreinte!==j.empreinte);
    if(!enPartie()&&!cartesUse(j))throw new Error("cartes illisibles");
    try{localStorage.setItem(CK,JSON.stringify({t:Date.now(),j}));}catch(e){}
    CARTES_T=Date.now();
    if(enPartie())return;   /* partie lancée pendant la lecture : servira à la prochaine */
    cartesMettre(j,`ton sheet ✓ lu le ${quand(Date.now())}${neuf?" · modifié depuis la dernière lecture":""}`);
    if(neuf)toast("🃏 Cartes mises à jour depuis ton sheet");
  }catch(e){console.warn("sheet",e);
    if(!enPartie())cartesMettre(c&&c.j,(c?`copie de ton sheet lue le ${quand(c.t)}`:"valeurs intégrées")+` · sheet injoignable (${e.message&&!/fetch|load/i.test(e.message)?e.message:"réseau"})`);}
  finally{CARTES_BUSY=false;cartesInfo();if(CARTES_ENCORE){CARTES_ENCORE=false;chargerCartes();}}}
/* retour sur l'app (après avoir modifié le sheet sur l'ordinateur, par exemple) : on relit, hors partie */

/* ===== Statistiques de parties → ton Google Sheet =====

   L'adresse du script est gardée sur le téléphone seulement (jamais dans le dépôt public). */
const STK="ts-stats-url",STQ="ts-stats-file";

let STBUSY=false;
async function statsFlush(){const url=statsUrl();if(!url||STBUSY)return;let q=statsQ();if(!q.length)return statsInfo();STBUSY=true;
  const rest=[];
  for(const p of q){try{await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});}catch(e){rest.push(p);}}
  statsSave(rest);STBUSY=false;statsInfo();}
function statsInfo(){const el=$("statsS");if(!el)return;const n=statsQ().length,u=statsUrl();
  el.textContent=!u?`📊 Statistiques : pas encore reliées à ton sheet${n?` · ${n} partie${n>1?"s":""} en attente`:""}`

  const top=S.players[rank[0]].score,win=rank.filter(i=>S.players[i].score===top);
  const pname=i=>i===null||i===undefined?"?":S.players[i].name,tname=i=>i===null||i===undefined?"":DECKS[S.players[i].deck].short;

    R.finalCamp===null||R.finalCamp===undefined?"au centre":pname(R.finalCamp),CARTES_TAG];
  const joueurs=S.players.map((p,i)=>{const st=R.st[i],o=obj&&obj[i];
    return [id,date,p.name,tname(i),p.score,rank.indexOf(i)+1,win.includes(i)&&win.length===1?1:0,o?OBJ[o.o].t:"",o?(o.ok?"oui":"non"):"",st.covers,st.sur,st.locks,st.ropeWins,st.held3?"oui":"non"];});
  const pts={};(R.sc||[]).forEach(x=>{pts[x.seq]=(pts[x.seq]||0)+x.pts;});

  const q=statsQ();q.push({id,partie,joueurs,cartes});statsSave(q);statsFlush();}

function rPull(i,f){const R=S.rope;if(!f)return;
  if(R.br===i||R.br===null)R.br=i,R.d=Math.min(ROPE.R,R.d+f);

      ropeBanner("🚫 SABOTAGE",`${PISTES[L.p]} de ${esc(o.name)} ne marque pas`,"#ff5468");}

{const _ra=ropeAction;ropeAction=function(c){const R=S&&S.rope,n0=R?R.usedA.length:0,L0=R&&R.lastPlace;_ra(c);

let detector=null,scanning=false,busy=false,turnScan=0,fpsN=0,fpsT=0,camRes="";
const video=$("video"),grab=$("grab"),g2d=grab.getContext("2d",{willReadFrequently:true});
async function startCamera(){
  if(scanning)return;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return camOff("Caméra indisponible ici","Ouvre la page en https dans Safari ou Chrome. Le simulateur reste utilisable.");
  if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.indexOf("qr_code")>=0)detector=new BarcodeDetector({formats:["qr_code"]});}catch(e){}}
  if(!detector&&!window.jsQR)return camOff("Lecteur QR non chargé","Recharge la page.");
  if(!detector)await qrWorkersInit();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}});}
  catch(e){return camOff("Caméra indisponible",({NotAllowedError:"Accès refusé : autorise la caméra pour ce site puis recharge.",NotFoundError:"Aucune caméra trouvée.",NotReadableError:"Caméra utilisée par une autre app."})[e.name]||("Erreur : "+(e.name||e.message)));}
  camStream=stream;video.srcObject=stream;try{await video.play();}catch(e){}
  await new Promise(r=>{if(video.videoWidth)r();else video.onloadedmetadata=r;});
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}
  /* mise au point continue quand la caméra le permet (surtout Android) */
  try{const tr=stream.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};if(cp.focusMode&&cp.focusMode.includes("continuous"))tr.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{});}catch(e){}
  camRes=video.videoWidth+"×"+video.videoHeight+" · "+(detector?"lecteur natif":QR.ok?"jsQR · "+QR.workers.length+" fil"+(QR.workers.length>1?"s":"")+" de lecture":"jsQR");
  camState("on",camRes);
  scanning=true;fpsT=performance.now();nextFrame();
}
function camState(st,info){const c=$("camChip");c.className="cam "+st;c.textContent=st==="on"?"● Caméra":st==="off"?"● Caméra coupée":"● Caméra";c.title=info||"";}
function camOff(t,sub,quiet){camState(quiet?"":"off",t+" · "+sub);if(!quiet)toast(t+" : "+sub,true);}
/* la vidéo est invisible : on lit chaque nouvelle image avec requestAnimationFrame */
let lastVT=-1;
/* ===== Lecture des QR hors du fil principal (iPhone et navigateurs sans lecteur natif) =====
   jsQR tourne dans 2 fils de calcul : la musique, l'écran et la corde ne sont plus bloqués pendant qu'une image est lue,
   et deux images sont lues en même temps. Chaque nouvelle image de la caméra est lue avec un cadrage différent, à tour de rôle :
   une lecture sur deux sur l'image entière (carte normale : lue tout de suite), les autres sur le centre agrandi
   puis trois bandes de l'image à pleine finesse (petite carte tenue loin, même sur un bord) ;
   dès qu'une carte est vue, une lecture sur deux se resserre autour de l'endroit où elle était (carte suivante au même endroit). */
const QR={workers:[],free:[],ok:false,fail:false,bm:null,turn:0,last:null,lastT:0,n:0,rate:0,rateT:0,lum:128,grid:null};
const QR_WORKER=`let oc=null,og=null;
self.onmessage=e=>{const m=e.data;let d;
  try{
    if(m.bm){if(typeof OffscreenCanvas==="undefined"){m.bm.close();self.postMessage({r:m.r,err:"nooff"});return;}
      if(!oc||oc.width!==m.w||oc.height!==m.h){oc=new OffscreenCanvas(m.w,m.h);og=oc.getContext("2d",{willReadFrequently:true});}
      if(!og){m.bm.close();self.postMessage({r:m.r,err:"nooff"});return;}
      og.drawImage(m.bm,0,0,m.w,m.h);m.bm.close();d=og.getImageData(0,0,m.w,m.h).data;}
    else d=new Uint8ClampedArray(m.buf);
  }catch(x){self.postMessage({r:m.r,err:"nooff"});return;}
  let lum=0;for(let i=0;i<d.length;i+=64)lum+=d[i]*77+d[i+1]*150+d[i+2]*29;lum=lum/(d.length/64)/256;
  if(m.r&&m.r.enh)renforce(d,m.w,m.h);
  let q=null;try{q=jsQR(d,m.w,m.h,{inversionAttempts:"dontInvert"});}catch(x){}
  const L=q&&q.location;
  self.postMessage({r:m.r,lum,txt:q?q.data:null,loc:L?[L.topLeftCorner,L.topRightCorner,L.bottomRightCorner,L.bottomLeftCorner]:null});};
/* Lecture renforcée : on lisse le bruit du capteur (moyenne 3×3), puis chaque point devient noir ou blanc selon la lumière
   de son voisinage (seuil local). La pénombre, le faible contraste et les bords assombris par l'objectif n'ont plus d'effet. */
let LB=null,IB=null;
function renforce(d,w,h){const n=w*h,W1=w+1;if(!LB||LB.length<n){LB=new Uint8Array(n);IB=new Uint32Array(W1*(h+1));}
  for(let i=0,j=0;j<n;i+=4,j++)LB[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
  for(let x=0;x<=w;x++)IB[x]=0;
  for(let y=0;y<h;y++){let s=0;const r=(y+1)*W1,p=y*W1;IB[r]=0;for(let x=0;x<w;x++){s+=LB[y*w+x];IB[r+x+1]=IB[p+x+1]+s;}}
  const box=(x0,y0,x1,y1)=>IB[y1*W1+x1]-IB[y0*W1+x1]-IB[y1*W1+x0]+IB[y0*W1+x0];
  const R=Math.max(10,Math.round(Math.min(w,h)/14));
  for(let y=0;y<h;y++){const a0=y>0?y-1:0,a1=y<h-1?y+2:h,b0=y>R?y-R:0,b1=y+R+1<h?y+R+1:h;
    for(let x=0;x<w;x++){const c0=x>0?x-1:0,c1=x<w-1?x+2:w,e0=x>R?x-R:0,e1=x+R+1<w?x+R+1:w;
      const v=box(c0,a0,c1,a1)*(e1-e0)*(b1-b0),mean=box(e0,b0,e1,b1)*(c1-c0)*(a1-a0);   /* v/aire3 < 0.9 × moyenne/aireR (sans division) */
      const o=(y*w+x)*4,bw=v<mean*.9?0:255;d[o]=d[o+1]=d[o+2]=bw;}}}`;
async function qrWorkersInit(){
  if(QR.ok||QR.fail)return QR.ok;
  try{
    const src=await (await fetch("jsQR.js")).text();   /* le code du lecteur est mis dans les fils (marche hors ligne) */
    const url=URL.createObjectURL(new Blob([src+"\n;"+QR_WORKER],{type:"application/javascript"}));
    const n=2;
    for(let i=0;i<n;i++){const w=new Worker(url);w.onerror=e=>{console.warn("fil QR",e);};QR.workers.push(w);
      /* mise en route : une première lecture à vide, pour que le lecteur soit déjà prêt quand la caméra s'allume */
      const z=new Uint8ClampedArray(96*96*4).fill(255);w.onmessage=()=>{w.onmessage=e=>qrDone(w,e.data);QR.free.push(w);};w.postMessage({buf:z.buffer,w:96,h:96,r:null},[z.buffer]);}
    QR.ok=true;
  }catch(e){console.warn("lecture QR en fil séparé indisponible : lecture classique",e);QR.fail=true;}
  return QR.ok;}
/* cadrage de la prochaine lecture, en pixels de la vidéo */
function qrRect(vw,vh,now){
  const L=QR.last&&now-QR.lastT<3000?QR.last:null,t=QR.turn++;
  const fit=(sx,sy,sw,sh,max,lab)=>{sx=Math.max(0,Math.round(sx));sy=Math.max(0,Math.round(sy));sw=Math.max(16,Math.round(Math.min(sw,vw-sx)));sh=Math.max(16,Math.round(Math.min(sh,vh-sy)));
    const k=Math.min(1,max/Math.max(sw,sh));return{sx,sy,sw,sh,ow:Math.max(16,Math.round(sw*k)),oh:Math.max(16,Math.round(sh*k)),lab};};
  if(L&&t%2===0){const cx=(L.x0+L.x1)/2,cy=(L.y0+L.y1)/2,s=Math.max(200,Math.max(L.x1-L.x0,L.y1-L.y0)*2.4),r=fit(cx-s/2,cy-s/2,s,s,520,"suivi");r.enh=QR.lum<60&&(t>>1)%2===1;return r;}
  const u=t>>(L?1:0),dark=QR.lum<60,G=qrGrid(vw,vh);
  if(u%2===0){const r=fit(0,0,vw,vh,640,"entier");r.enh=dark&&(u>>1)%2===1;return r;}
  const v=u>>1,k=v%(G.length+1),pass=Math.floor(v/(G.length+1));
  const r=k===G.length?fit((vw-G.T)/2,(vh-G.T)/2,G.T,G.T,720,"centre"):fit(G[k][0],G[k][1],G.T,G.T,720,"case "+(k+1));
  /* d'un tour de grille à l'autre : lecture normale ou renforcée, puis carte vue de biais (resserrée en largeur ou en hauteur) */
  r.enh=dark||pass%2===1;const asp=(dark?pass:pass>>1)%3;if(asp===1)r.ow=Math.round(r.ow*.8);else if(asp===2)r.oh=Math.round(r.oh*.8);return r;}
/* carrés qui se chevauchent de moitié et couvrent toute l'image à pleine finesse (8 cases pour 720×1280) : une petite carte est toujours entière dans l'une d'elles */
function qrGrid(vw,vh){const key=vw+"x"+vh;if(QR.grid&&QR.grid.key===key)return QR.grid;
  const T=Math.round(Math.min(vw,vh)*.75),pos=(L)=>{const n=Math.max(1,Math.ceil((L-T)/(T*.5))+1);return [...Array(n)].map((_,i)=>n===1?0:Math.round(i*(L-T)/(n-1)));};
  const g=[];for(const y of pos(vh))for(const x of pos(vw))g.push([x,y]);g.T=T;g.key=key;return QR.grid=g;}
async function qrJob(w){
  const vw=video.videoWidth,vh=video.videoHeight,r=qrRect(vw,vh,performance.now());
  try{
    /* copie de l'image dans un petit canvas (quelques ms), puis lecture dans le fil : plus rapide que de passer l'image elle-même au fil */
    if(grab.width!==r.ow||grab.height!==r.oh){grab.width=r.ow;grab.height=r.oh;}
    g2d.imageSmoothingEnabled=true;g2d.imageSmoothingQuality="high";
    g2d.drawImage(video,r.sx,r.sy,r.sw,r.sh,0,0,r.ow,r.oh);
    const im=g2d.getImageData(0,0,r.ow,r.oh);w.postMessage({buf:im.data.buffer,w:r.ow,h:r.oh,r},[im.data.buffer]);
  }catch(e){QR.bm=false;QR.free.push(w);}}
function qrDone(w,d){QR.free.push(w);QR.n++;
  const now=performance.now();if(now-QR.rateT>=1000){QR.rate=Math.round(QR.n*1000/(now-QR.rateT||1000));QR.n=0;QR.rateT=now;$("camChip").title=camRes+" · "+QR.rate+" lectures/s";}
  if(d.err){QR.bm=false;return;}
  if(d.r&&d.r.lab==="entier"&&typeof d.lum==="number")QR.lum+=(d.lum-QR.lum)*.2;   /* lumière de la pièce, suivie en continu */
  if(!d.txt)return;
  const r=d.r,kx=r.sw/r.ow,ky=r.sh/r.oh,xs=d.loc.map(p=>r.sx+p.x*kx),ys=d.loc.map(p=>r.sy+p.y*ky);
  QR.last={x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};QR.lastT=now;
  try{onCode(d.txt);}catch(e){console.error(e);}}
/* à chaque nouvelle image de la caméra : jusqu'à 2 lectures (une par fil libre), avec des cadrages différents */
function qrLoop(){if(!scanning)return;requestAnimationFrame(()=>{
  if(!scanning)return;
  if(!document.hidden&&video.videoWidth&&video.currentTime!==lastVT){lastVT=video.currentTime;let k=0;while(QR.free.length&&k<2){k++;qrJob(QR.free.pop());}}
  qrLoop();});}
function nextFrame(){if(!scanning)return;if(!detector&&QR.ok)return qrLoop();requestAnimationFrame(tick);}
async function tick(){
  if(!busy&&!document.hidden&&video.videoWidth&&video.currentTime!==lastVT){lastVT=video.currentTime;
    busy=true;
    try{const txt=await decodeFrame();if(txt)onCode(txt);}catch(e){}
    busy=false;fpsN++;
    const now=performance.now();if(now-fpsT>1000){$("camChip").title=camRes+" · "+fpsN+" lectures/s";fpsN=0;fpsT=now;}
  }
  nextFrame();
}
async function decodeFrame(){
  if(detector){const r=await detector.detect(video);return r.length?r[0].rawValue:null;}
  const vw=video.videoWidth,vh=video.videoHeight;let sx=0,sy=0,sw=vw,sh=vh;
  if(turnScan++%2===1){sw=sh=Math.min(vw,vh)*.75;sx=(vw-sw)/2;sy=(vh-sh)/2;}
  const k=Math.min(1,640/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k);
  if(grab.width!==w||grab.height!==h){grab.width=w;grab.height=h;}
  g2d.drawImage(video,sx,sy,sw,sh,0,0,w,h);
  const r=jsQR(g2d.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});
  return r?r.data:null;
}
/* ===== App installable et hors ligne (PWA) =====
   sw.js garde la page, le lecteur de QR, les polices et tous les sons sur le téléphone.
   Pour publier une nouvelle version : change seulement VERSION en haut du script (ex. "v89"). */
let offInfo="",installEvt=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function offHTML(){
  let h=offInfo;
  if(installEvt)h+=` <button class="chip" id="installBtn">📲 Installer l'app</button>`;
  else if(!standalone()&&/iP(hone|ad|od)/.test(navigator.userAgent))h+=(h?"<br>":"")+"📲 Pour l'installer : bouton Partager (en bas dans Safari, en haut à droite dans Chrome) → « Sur l'écran d'accueil »";
  return h;}
function showOff(){const el=$("offStatus");if(!el)return;el.innerHTML=offHTML();const b=$("installBtn");
  if(b)b.onclick=async()=>{const ev=installEvt;installEvt=null;showOff();try{ev.prompt();await ev.userChoice;}catch(e){}};}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;showOff();});
addEventListener("appinstalled",()=>{installEvt=null;showOff();toast("App installée sur l'écran d'accueil");});
/* liste des sons du dépôt (celle que l'app a récupérée au démarrage) */
function treeSons(){try{const c=JSON.parse(localStorage.getItem("ts-tree")||"null");return c&&Array.isArray(c.list)?c.list:null;}catch(e){return null;}}
const sonURL=p=>new URL(p.split("/").map(encodeURIComponent).join("/"),location.href).href;
/* télécharge ce qui manque encore sur le téléphone (ex. la toute première ouverture, avant que sw.js soit actif) */
let filling=false;
async function remplirHorsLigne(){
  if(filling||!navigator.serviceWorker||!navigator.serviceWorker.controller||!window.caches)return;
  const list=treeSons();if(!list)return majOff();
  filling=true;
  try{const c=await caches.open("ts-sons");const have=new Set((await c.keys()).map(r=>r.url));
    const todo=list.filter(p=>!have.has(sonURL(p)));let i=0;
    const worker=async()=>{while(i<todo.length){const p=todo[i++];try{const r=await fetch(sonURL(p));if(r.ok)await r.arrayBuffer();}catch(e){}majOff();}};
    await Promise.all([worker(),worker(),worker(),worker()]);}
  finally{filling=false;}
  majOff();}
async function majOff(){
  if(!window.caches||!navigator.serviceWorker||!navigator.serviceWorker.controller){showOff();return;}
  try{const c=await caches.open("ts-sons");const keys=(await c.keys()).map(r=>r.url);
    const list=treeSons();const mp3=keys.filter(u=>/\.mp3$/i.test(u)).length;
    if(list){const want=list.filter(p=>/\.mp3$/i.test(p)),have=new Set(keys),ok=want.filter(p=>have.has(sonURL(p))).length;
      offInfo=ok>=want.length?`✈️ Hors ligne : prêt · ${want.length} sons sur le téléphone`:`⏳ Hors ligne : ${ok} / ${want.length} sons sur le téléphone… garde l'app ouverte avec du réseau`;}
    else offInfo=mp3?`✈️ ${mp3} sons sur le téléphone`:"";
  }catch(e){}
  showOff();}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  const had=!!navigator.serviceWorker.controller,lastV=(()=>{try{return localStorage.getItem("ts-ver");}catch(e){return null;}})();
  navigator.serviceWorker.register("sw.js?v="+encodeURIComponent(VERSION)).catch(e=>console.warn("sw",e));
  navigator.serviceWorker.addEventListener("controllerchange",()=>{majOff();PRE&&PRE.then(remplirHorsLigne);});
  if(had&&lastV&&lastV!==VERSION)setTimeout(()=>toast("Mise à jour installée : "+VERSION),1200);
  try{localStorage.setItem("ts-ver",VERSION);}catch(e){}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});   /* évite que le téléphone efface les sons pour faire de la place */
}
showOff();

$("verTag").textContent=VERSION;
$("rpBpm").onclick=()=>{if(!PX.on)return toast("Visuels : ancien dessin (carte graphique indisponible)");PX.showFps=!PX.showFps;if(PX.fpsTx)PX.fpsTx.text=PX.showFps?"…":"";};
pxBoot();statsFlush();
preloadSons().then(remplirHorsLigne);
camOff("Caméra pas encore lancée","Elle démarre avec la partie.",true);setup();
